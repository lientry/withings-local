[project]
name = "withings-local"
version = "0.1.0"
description = "Local Bluetooth access to Withings smart scales, for Home Assistant. Not affiliated with Withings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]
ha = ["pytest-homeassistant-custom-component>=0.13.372"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/withings_wpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# The library itself supports 3.13+; the dev environment follows Home Assistant's minimum.
environments = ["python_full_version >= '3.14.2'"]
